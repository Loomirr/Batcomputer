site_name: Batcomputer
site_url: https://loomirr.github.io/Batcomputer/
site_description: Create suits, equipment, and custom characters for LEGO Batman — Legacy of the Dark Knight
repo_url: https://github.com/Loomirr/Batcomputer
repo_name: Loomirr/Batcomputer
edit_uri: edit/main/docs/
copyright: Batcomputer is an unofficial community tool and is not affiliated with TT Games, Warner Bros. Games, or the LEGO Group.

theme:
  name: material
  language: en
  logo: assets/brand/Header.png
  favicon: assets/brand/Icon.ico
  palette:
    scheme: slate
    primary: black
    accent: amber
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

# Keep dated investigations in the repository, not in user-facing site search.
exclude_docs: |
  /research/
  /guides/custom-equipment-proof.md
  /guides/equipment-inventory.md
  /guides/development-roadmap.md
  /releases/1.0.0-beta.3.md

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/batcomputer.css

nav:
  - Home: index.md
  - Getting started:
      - Requirements: getting-started/requirements.md
      - Install Batcomputer: getting-started/install.md
      - Update Batcomputer: guides/app-updates.md
      - First-time setup: getting-started/setup.md
  - Tutorials:
      - Create your first suit: guides/first-suit.md
      - Choose visual and gameplay donors: guides/choosing-donors.md
      - Custom characters: guides/custom-characters.md
      - Change a character's identity: guides/character-identity.md
      - Character game modes: guides/character-modes.md
      - Character 3D workshop: guides/character-workshop.md
      - Update or repair a suit: guides/update-repair-suit.md
      - Review and remove edits: guides/review-changes.md
      - Back up and move a workspace: guides/backups-and-moving.md
      - Materials, textures, and faces: guides/materials-textures-faces.md
      - Character animations: guides/animations.md
      - Suit abilities: guides/abilities.md
      - Custom held-item models: guides/weapon-model-editor-plan.md
      - Custom equipment: guides/equipment-workshop.md
      - Custom vehicles (experimental): guides/vehicles.md
      - Vehicle summon and parked models: guides/vehicle-summon-models.md
      - Custom static meshes: guides/custom-meshes.md
      - Skinned meshes (experimental): guides/skeletal-mesh-proof.md
      - Prepare a rig in Blender: guides/blender-rig-preparation.md
      - Build, test, and share: guides/build-test-share.md
      - Import and export projects: guides/import-export.md
  - Reference:
      - Workspace and files: reference/workspace.md
      - Settings and preview performance: reference/settings.md
      - Compatibility and limits: reference/compatibility.md
      - Frequently asked questions: reference/faq.md
      - Changelog: reference/changelog.md
      - Third-party notices: reference/third-party-notices.md
  - Help:
      - Troubleshooting: help/troubleshooting.md
      - Report a problem: help/reporting-issues.md
